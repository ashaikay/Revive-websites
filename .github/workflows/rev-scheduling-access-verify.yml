name: REV Scheduling manager access verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scheduling-access:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revive-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run src/tests/schedulingManagementAccess.test.tsx src/tests/workspaceModuleAccess.test.tsx src/tests/workspaceTeamUI.test.tsx src/tests/schedulingWorkerArchiveUI.test.tsx src/tests/schedulingRecoveryUI.test.tsx src/tests/schedulingRequiredSkillsUI.test.tsx src/tests/schedulingDailySaveFeedbackUI.test.tsx src/tests/jobAssignmentsPanelUI.test.tsx --maxWorkers=1
      - run: node --experimental-strip-types --test supabase/functions/rev-worker-save/*.test.ts supabase/functions/rev-worker-pattern-save/*.test.ts supabase/functions/rev-worker-unavailability-save/*.test.ts supabase/functions/rev-scheduling-job-save/*.test.ts supabase/functions/rev-scheduling-assignment-save/*.test.ts supabase/functions/rev-scheduling-daily-sessions-save/*.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check operational Scheduling functions
        run: |
          for function in rev-worker-save rev-worker-pattern-save rev-worker-unavailability-save rev-scheduling-job-save rev-scheduling-assignment-save rev-scheduling-daily-sessions-save; do
            deno check "supabase/functions/$function/index.ts"
          done
      - run: npm run build
  scheduling-access-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: revive-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx --yes supabase@2.117.0 start --exclude studio
      - name: Verify delegated Scheduling authority in isolated local Supabase
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              ANON_KEY) export REV_LOCAL_SUPABASE_ANON_KEY="$value" ;;
              SERVICE_ROLE_KEY) export REV_LOCAL_SUPABASE_SERVICE_ROLE_KEY="$value" ;;
            esac
          done < <(npx --yes supabase@2.117.0 status -o env)
          test -n "${REV_LOCAL_SUPABASE_ANON_KEY:-}"
          test -n "${REV_LOCAL_SUPABASE_SERVICE_ROLE_KEY:-}"
          node src/tests/scheduling_management_local_validation.mjs
      - if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
