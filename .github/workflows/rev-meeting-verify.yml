name: REV meeting verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  meeting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revive-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/verify-rev-meeting.mjs
      - run: npm test -- src/tests/phase5e1_meetingOutcome.test.tsx src/tests/phase5j_meetingProposalSubmission.test.tsx src/tests/phase5k_meetingProposalReview.test.tsx src/tests/phase5l_revInterfaceTidyUI.test.tsx src/tests/phase5n_microsoftGraphCalendarEvent.test.ts src/tests/calendarAvailabilityLocalDateUI.test.tsx src/tests/schedulingRecoveryUI.test.tsx src/tests/schedulingWorkerArchiveUI.test.tsx src/tests/schedulingSuitabilityUI.test.tsx src/tests/jobAssignmentsPanelUI.test.tsx src/tests/schedulingDailySaveFeedbackUI.test.tsx src/tests/schedulingJobCancellationUI.test.tsx src/tests/schedulingSuitabilityRefreshUI.test.tsx src/tests/schedulingRequiredSkillsUI.test.tsx src/tests/schedulingAssignedJobCancellationUI.test.tsx src/tests/outlookConnectionPanelUI.test.tsx src/tests/annualLeaveStage3UI.test.tsx src/tests/annualLeaveStage3InteractionUI.test.tsx src/tests/annualLeaveStage3LifecycleUI.test.tsx src/tests/officialBankHolidayImportUI.test.tsx
      - name: Test customer calendar integration
        run: |
          node --experimental-strip-types --test \
            supabase/functions/rev-calendar-connection-create/*.test.ts \
            supabase/functions/rev-calendar-oauth-start/*.test.ts \
            supabase/functions/rev-calendar-oauth-complete/*.test.ts \
            supabase/functions/rev-calendar-discover/*.test.ts \
            supabase/functions/rev-calendar-select/*.test.ts \
            supabase/functions/rev-calendar-disconnect/*.test.ts \
            supabase/functions/rev-calendar-reconnect/*.test.ts \
            supabase/functions/rev-calendar-business-hours-save/*.test.ts \
            supabase/functions/rev-meeting-outcome-save/*.test.ts \
            supabase/functions/rev-worker-save/*.test.ts \
            supabase/functions/rev-worker-pattern-save/*.test.ts \
            supabase/functions/rev-worker-unavailability-save/*.test.ts \
            supabase/functions/rev-annual-leave-policy-save/*.test.ts \
            supabase/functions/rev-annual-leave-account-open/*.test.ts \
            supabase/functions/rev-annual-leave-adjustment-save/*.test.ts \
            supabase/functions/rev-annual-leave-calendar-configure/*.test.ts \
            supabase/functions/rev-annual-leave-bank-holiday-import/*.test.ts \
            supabase/functions/rev-workspace-bank-holiday-save/*.test.ts \
            supabase/functions/rev-annual-leave-record/*.test.ts \
            supabase/functions/rev-annual-leave-cancel/*.test.ts \
            supabase/functions/rev-legacy-annual-leave-cancel/*.test.ts \
            supabase/functions/rev-scheduling-job-save/*.test.ts \
            supabase/functions/rev-scheduling-daily-sessions-save/*.test.ts \
            supabase/functions/rev-scheduling-assignment-save/*.test.ts \
            supabase/functions/rev-calendar-availability/workspaceBusinessHours.test.ts \
            supabase/functions/rev-calendar-availability/selectedCalendarAvailability*.test.ts \
            supabase/functions/_shared/microsoftGraphCalendarDiscovery.test.ts \
            supabase/functions/_shared/microsoftGraphSelectedCalendarAvailability.test.ts \
            src/tests/phase5_calendar_oauth_browser.test.mjs \
            src/tests/phase5_calendar_discovery_browser.test.mjs \
            src/tests/phase5_calendar_selection_browser.test.mjs \
            src/tests/phase5_calendar_disconnect_browser.test.mjs \
            src/tests/phase5_calendar_reconnect_browser.test.mjs \
            src/tests/phase5_calendar_business_hours_browser.test.mjs \
            src/tests/worker_records_browser.test.mjs \
            src/tests/worker_patterns_browser.test.mjs \
            src/tests/worker_unavailability_browser.test.mjs \
            src/tests/scheduling_jobs_browser.test.mjs \
            src/tests/scheduling_daily_sessions_browser.test.mjs \
            src/tests/scheduling_assignments_browser.test.mjs \
            src/tests/scheduling_planner_browser.test.mjs \
            src/tests/scheduling_skill_matching_browser.test.mjs \
            src/tests/scheduling_recovery_browser.test.mjs \
            src/tests/scheduling_display_browser.test.mjs \
            src/tests/annual_leave_stage3_browser.test.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: revive-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Start isolated local Supabase and apply migrations
        run: npx --yes supabase@2.117.0 start --exclude studio
      - name: Test durable reservation and provider controls
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              ANON_KEY) export REV_LOCAL_SUPABASE_ANON_KEY="$value" ;;
              SERVICE_ROLE_KEY) export REV_LOCAL_SUPABASE_SERVICE_ROLE_KEY="$value" ;;
            esac
          done < <(npx --yes supabase@2.117.0 status -o env)
          test -n "${REV_LOCAL_SUPABASE_ANON_KEY:-}"
          test -n "${REV_LOCAL_SUPABASE_SERVICE_ROLE_KEY:-}"
          node src/tests/phase5w_local_claim_validation.mjs
          node --experimental-strip-types src/tests/phase6f_local_provider_lifecycle.mjs
          node --experimental-strip-types src/tests/phase6c_local_graph_adapter_validation.mjs
          node src/tests/phase6g_local_delegated_token_validation.mjs
          node src/tests/phase5e1_meeting_outcome_local_validation.mjs
          node src/tests/phase5_calendar_connections_local_validation.mjs
          node src/tests/phase5_calendar_oauth_storage_local_validation.mjs
          node src/tests/phase5_calendar_connection_creation_local_validation.mjs
          node src/tests/phase5_calendar_discovery_local_validation.mjs
          node src/tests/phase5_calendar_selection_local_validation.mjs
          node src/tests/phase5_selected_calendar_credential_local_validation.mjs
          node src/tests/phase5_calendar_disconnect_local_validation.mjs
          node src/tests/phase5_calendar_reconnect_local_validation.mjs
          node src/tests/phase5_calendar_business_hours_local_validation.mjs
          node src/tests/worker_records_local_validation.mjs
          node src/tests/worker_patterns_local_validation.mjs
          node src/tests/worker_unavailability_local_validation.mjs
          node src/tests/annual_leave_stage1_local_validation.mjs
          node src/tests/annual_leave_stage2_local_validation.mjs
          node src/tests/scheduling_jobs_local_validation.mjs
          node src/tests/scheduling_daily_sessions_local_validation.mjs
          node src/tests/scheduling_assignments_local_validation.mjs
      - name: Test official bank holiday import authority
        shell: bash
        run: |
          docker exec -i supabase_db_revive-app \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < src/tests/official_bank_holiday_import_local.sql
      - name: Test scheduling skill matching authority
        shell: bash
        run: |
          docker inspect supabase_db_revive-app --format '{{.State.Running}}' | grep -qx true
          node --experimental-strip-types src/tests/scheduling_skill_matching_local_validation.mjs
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.117.0 stop
