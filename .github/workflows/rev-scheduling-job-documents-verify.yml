name: REV scheduling job documents verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  job-documents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revive-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test -- src/tests/schedulingJobDocuments.test.ts src/tests/schedulingJobDocumentsUI.test.tsx src/tests/schedulingSuitabilityUI.test.tsx src/tests/jobAssignmentsPanelUI.test.tsx
      - run: node --experimental-strip-types --test supabase/functions/rev-scheduling-job-document-upload/*.test.ts supabase/functions/rev-scheduling-job-document-access/*.test.ts supabase/functions/rev-scheduling-job-document-analyse/*.test.ts supabase/functions/rev-scheduling-job-requirements-confirm/*.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/rev-scheduling-job-document-upload/index.ts
      - run: deno check supabase/functions/rev-scheduling-job-document-access/index.ts
      - run: deno check supabase/functions/rev-scheduling-job-document-analyse/index.ts
      - run: deno check supabase/functions/rev-scheduling-job-requirements-confirm/index.ts
      - run: npm run build

  job-documents-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: revive-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npx --yes supabase@2.117.0 start --exclude studio
      - name: Test job-document tenant authority and retries
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              ANON_KEY) export REV_LOCAL_SUPABASE_ANON_KEY="$value" ;;
              SERVICE_ROLE_KEY) export REV_LOCAL_SUPABASE_SERVICE_ROLE_KEY="$value" ;;
            esac
          done < <(npx --yes supabase@2.117.0 status -o env)
          test -n "${REV_LOCAL_SUPABASE_ANON_KEY:-}"
          test -n "${REV_LOCAL_SUPABASE_SERVICE_ROLE_KEY:-}"
          node src/tests/scheduling_job_documents_local_validation.mjs
      - if: always()
        run: npx --yes supabase@2.117.0 stop
